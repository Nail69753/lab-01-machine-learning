
dataset:
  name: adult
  source: openml
  version: 2
  target: class

split:
  test_size: 0.30
  random_state: 42
  stratify: true

preprocessing:
  numeric_imputation: median
  categorical_imputation: most_frequent
  lower_percentile: 1
  upper_percentile: 99
  remove_train_duplicates: true

features:
  engineered:
    - capital_net
    - hours_per_age

model:
  name: LogisticRegression
  max_iter: 1000
  solver: liblinear
  random_state: 42

audit:
  sample_size: 50
  random_state: 42

output:
  directory: lab.04/results
